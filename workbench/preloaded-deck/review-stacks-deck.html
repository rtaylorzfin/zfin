</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-class="lead" data-theme="default" lang="en-US" class="lead" style="--header:Review stacks;--footer:branch: preloaded-dev-stacks;--class:lead;--theme:default;">
<header>Review stacks</header>

<h1 id="review-stacks">Review stacks</h1>
<h3 id="parallel-feature-branches-each-at-its-own-url--reviewable-before-merge">Parallel feature branches, each at its own URL — reviewable before merge</h3>
<p>What was built on top of the preloaded dev stacks, why each piece exists,<br />
and where it is more complicated than it needs to be.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="two-things-this-buys-you">Two things this buys you</h2>
<p><strong>1. Work several tickets at once, properly isolated.</strong><br />
Each branch gets its own database, Solr index, Tomcat and hostname. No branch switching,<br />
no reloading data, no two tickets fighting over <code>:443</code> or one schema.</p>
<p><strong>2. Stage a branch so it can be looked at during code review — before it merges.</strong><br />
A reviewer opens a URL and sees the actual change running against real data, instead of<br />
reading a diff and imagining it. Screenshots in the PR stop being the best available<br />
evidence.</p>
<p>The first was mostly delivered by preloaded stacks. <strong>The second is what this branch adds</strong><br />
— and it is the one that changes how review works.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="where-we-started">Where we started</h2>
<p>Preloaded stacks solved <em>provisioning</em>: a loaded ZFIN in minutes, several at once.</p>
<p>They left four things unsolved:</p>
<ul>
<li><strong>Reaching them.</strong> <code>127.0.0.5:443</code>, one <code>/etc/hosts</code> entry per stack, a <code>sudo</code><br />
prompt per machine. Nobody else could open your work.</li>
<li><strong>Disk.</strong> ~28 GB per stack. Three stacks ≈ 100 GB. <code>stop</code> frees nothing.</li>
<li><strong>Certificates.</strong> Click-through warnings everywhere.</li>
<li><strong>Agents.</strong> Running Claude with <code>--dangerously-skip-permissions</code> against your<br />
primary checkout is not a sandbox.</li>
</ul>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="the-shape-of-the-answer">The shape of the answer</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>            *.review.zfin.test  ──DNS──▶  one proxy  ──Host header──▶  the right stack
                                             │
   zfin-1234 ─┐                              │   no match? ──▶ landing page
   zfin-5678 ─┼── each an httpd on ──────────┘                  &quot;here's how to make one&quot;
   zfin-9999 ─┘   zfin_review_net

   freeze ──▶ tar the volumes to cheap storage, down -v, keep the worktree
   thaw   ──▶ put it all back

   ./z run claude ──▶ a sidecar with this worktree, no keys, no docker socket
</code></pre>
<p>Four pieces: <strong>routing</strong>, <strong>freeze/thaw</strong>, <strong>the sidecar</strong>, and the <strong><code>feature</code> instance</strong><br />
that stops a dev stack claiming to be production.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="1-routing-one-proxy-not-n-ports">1. Routing: one proxy, not N ports</h2>
<p>Before: every stack published <code>127.0.0.X:443</code>, needed a loopback alias (<code>sudo</code>), and an<br />
<code>/etc/hosts</code> line.</p>
<p>Now: one <code>nginx-proxy</code> owns <code>:443</code>. A stack joins <code>zfin_review_net</code> and carries<br />
<code>VIRTUAL_HOST</code> — which the compose file <strong>already set</strong> from <code>DOCKER_VIRTUAL_HOST</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># docker-compose.overlay-review-member.yml — the entire per-feature change</span>
<span class="hljs-attr">services:</span>
  <span class="hljs-attr">httpd:</span>
    <span class="hljs-attr">ports:</span> <span class="hljs-type">!reset</span> <span class="hljs-literal">null</span>        <span class="hljs-comment"># the proxy owns :443 now</span>
    <span class="hljs-attr">networks:</span> [<span class="hljs-string">default</span>, <span class="hljs-string">review</span>]
</code></pre>
<p>Name resolution is <strong>one wildcard DNS record</strong> for the zone, not one entry per stack.<br />
Nothing is added per feature; nothing needs cleaning up at teardown.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="two-decisions-worth-defending">Two decisions worth defending</h2>
<p><strong>We run our own proxy, never IT's.</strong> If they keep one in front, it forwards a single<br />
wildcard to us — <em>one entry, once</em>. If they remove it, we bind <code>:443</code> directly, which is<br />
already the laptop path. We never need per-ticket cooperation.</p>
<p><strong>The proxy speaks HTTPS to httpd, not plain HTTP.</strong> Terminating TLS once looks simpler,<br />
but <code>conf-zfin.org</code>'s port-80 vhost redirects <code>/jobs</code>, <code>/solr</code>, <code>/logs</code>, <code>/mailpit</code> to<br />
https whenever <code>%{HTTPS}</code> is off — with a plain-http backend that is an <strong>infinite<br />
redirect loop</strong> on exactly those paths.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="2-freeze--thaw-the-disk-answer">2. Freeze / thaw: the disk answer</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">z feature freeze ZFIN-1234     <span class="hljs-comment"># tar volumes to cheap storage, down -v, keep the worktree</span>
z feature thaw   ZFIN-1234     <span class="hljs-comment"># put it back</span>
</code></pre>
<p>Measured on a real 21.7 GB stack:</p>
<table>
<thead>
<tr>
<th></th>
<th>freeze</th>
<th>thaw</th>
<th>archive</th>
</tr>
</thead>
<tbody>
<tr>
<td>default (pigz)</td>
<td><strong>1m 21s</strong></td>
<td>1m 58s</td>
<td>6.9 GB</td>
</tr>
<tr>
<td><code>--no-compress</code></td>
<td>2m 12s</td>
<td><strong>55s</strong></td>
<td>21.2 GB</td>
</tr>
<tr>
<td><code>--reseed</code> (code-only branch)</td>
<td><strong>27s</strong></td>
<td>1m 01s</td>
<td>0.5 GB</td>
</tr>
</tbody>
</table>
<p>Reversible, unlike <code>z feature rm</code>: the worktree and branch stay put.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="what-freeze-had-to-get-right">What freeze had to get right</h2>
<p><strong>Ordering.</strong> App tier fully stopped before the data tier, and the database <em>verifiably</em><br />
shut down before it is tarred. A torn PGDATA in an archive is the one unrecoverable<br />
failure, discovered at thaw, months later.</p>
<p><strong>Composition.</strong> A <code>--shared-db</code> stack has no <code>pg_data</code> of its own — that data belongs to<br />
<code>zfin_shared</code> and other stacks are live on it. The volume list is derived from the stack's<br />
own compose, never a fixed list.</p>
<p><strong>Refusing.</strong> Thaw pins a <code>--reseed</code> archive to the preloaded image <strong>by ID</strong>: a rebaked<br />
image under the same tag is different data, and nothing downstream would notice.</p>
<p><em>The shutdown check is verified rather than assumed — an early version compared against an<br />
empty string and could never pass. A safety check that cannot pass is worse than none.</em></p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="3-the-sidecar">3. The sidecar</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">cd</span> &lt;worktree&gt; &amp;&amp; ./z run claude      <span class="hljs-comment"># same verb as ./z run compile</span>
</code></pre>
<p>Built <strong>on the compile image</strong>, not a minimal one. A minimal image is more isolated but<br />
cannot compile, test or deploy — which makes the agent useless and pushes every build back<br />
to a human.</p>
<p>That trade is only acceptable because <code>compile</code> was already hardened: <strong>no docker socket,<br />
no SSH agent, no keys</strong>. So &quot;the agent cannot push&quot; is structural, not a rule.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="what-the-sidecar-cannot-do--by-construction">What the sidecar cannot do — by construction</h2>
<table>
<thead>
<tr>
<th></th>
<th>why</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>git push</code></td>
<td>no agent, no keys. A <code>PreToolUse</code> hook makes the failure legible</td>
</tr>
<tr>
<td>drive Docker</td>
<td>no socket mounted</td>
</tr>
<tr>
<td>reach another worktree</td>
<td>only this one is mounted</td>
</tr>
<tr>
<td>reach <code>/mnt/research</code></td>
<td>not mounted — it spans other instances and prod unloads</td>
</tr>
<tr>
<td>restart Tomcat</td>
<td>a host operation; <code>buildfiles/tomcat.xml</code> fails deliberately</td>
</tr>
</tbody>
</table>
<p>It <strong>can</strong> build, test, <code>dirtydeploy</code>, reach <code>db</code>/<code>solr</code>, and <code>loaddb</code> (dumps mounted<br />
read-only). Note <code>loaddb</code> destroys that stack's database — blast radius is one feature's<br />
own copy.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="auth-the-decision-that-shaped-the-rest">Auth: the decision that shaped the rest</h2>
<p>Three options: log in inside the container, a host token, or an API key.</p>
<p><strong>The deciding argument was archiving, not convenience.</strong> A container-side <code>claude auth login</code> writes credentials into <code>~/.claude</code> — which <em>is</em> the <code>claude_home</code> volume — which<br />
<code>z feature freeze</code> archives. Every archive would carry a working login to whatever<br />
external storage it was parked on.</p>
<p>So the token stays on the <strong>host</strong>, mounted read-only. <code>claude_home</code> holds only session<br />
history, and archives stay credential-free — <strong>verified</strong>: 4 transcripts, 0 credential files.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="4-the-feature-instance">4. The <code>feature</code> instance</h2>
<p>Every feature stack generated <strong><code>coral</code>'s</strong> properties, including <code>DOMAIN_NAME=zfin.org</code>.</p>
<p>So a stack served at <code>zfin-1234.review.zfin.test</code> still emitted absolute links — and<br />
addressed mail — to <strong>production</strong>. Latent for years; invisible until review URLs made<br />
stacks shareable.</p>
<p>Now there is a <code>feature</code> instance whose <code>DOMAIN_NAME</code> follows the stack's own host, with a<br />
distinct banner colour and its own <code>email_overrides</code> entry.</p>
<p><em><code>TODO.txt</code> had been asking whether a feature needs its own instance. This was the answer.</em></p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="one-tree-one-declared-root">One tree, one declared root</h2>
<p>Everything the tooling owns lives under one directory you name — no absolute defaults<br />
guessing at someone else's machine:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ZFIN_DEV_ROOT/
├── repos/coral/         the checkout — named for the INSTANCE, not &quot;zfin.org&quot;
├── worktrees/zfin-1234/ one per feature; the directory name IS the ticket
├── review/              proxy certs, allowlist, stacks.json
├── archive/             freeze archives + sidecar sessions
├── cache/               preloaded-app tarballs
└── mounts/              the DOCKER_*_PATH bind mounts
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">./z scaffold --root ~/zfin-dev     <span class="hljs-comment"># creates what&#x27;s missing, never clobbers</span>
</code></pre>
<p><code>ZFIN_DEV_ROOT</code> is <strong>required</strong>. Unset, you get an error naming the fix — not a directory<br />
appearing somewhere you did not expect.</p>
<p><em>Not in the tree: the sidecar token. It stays in <code>$HOME</code>, because this tree is<br />
group-writable on a shared host.</em></p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="the-lifecycle-end-to-end">The lifecycle, end to end</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">z review up                          <span class="hljs-comment"># once per host</span>
z feature new ZFIN-1234 --up         <span class="hljs-comment"># → https://zfin-1234.review.zfin.test</span>
<span class="hljs-built_in">cd</span> <span class="hljs-variable">$ZFIN_DEV_ROOT</span>/worktrees/zfin-1234
./z run claude                       <span class="hljs-comment"># work in the sidecar</span>
./z feature freeze                   <span class="hljs-comment"># park it (ticket inferred from the cwd)</span>
./z feature thaw                     <span class="hljs-comment"># bring it back</span>
./z feature <span class="hljs-built_in">rm</span>                       <span class="hljs-comment"># archives the session, then removes everything</span>
</code></pre>
<p><code>z feature ls</code> shows <code>up | down | frozen</code>. The landing page shows the same inventory, and<br />
tells a visitor how to create or thaw a stack that isn't there.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="the-code-review-workflow">The code-review workflow</h2>
<p>Reviewing someone else's PR — no branch switching, no rebuild of your own work:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">z feature new review-1234 --existing-branch --branch ZFIN-1234 \
                          --shared-db --review --up
<span class="hljs-comment">#   → https://review-1234.review.zfin.test</span>
<span class="hljs-comment"># ... click through the actual change, against real data ...</span>
z feature <span class="hljs-built_in">rm</span> review-1234
</code></pre>
<p><code>--existing-branch</code> checks out a branch that already exists — including one known only to<br />
<code>origin</code>, so a colleague's PR works. <code>--shared-db</code> skips the per-stack data copy, which is<br />
right for a read-mostly review.</p>
<p>The stack is disposable; the archive of what you found is the PR comment.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="honest-caveat-who-can-open-the-link-today">Honest caveat: who can open the link today</h2>
<p>On a <strong>laptop</strong>, the proxy binds <code>127.0.0.1</code> and the zone resolves via your own dnsmasq.<br />
The URL works for <em>you</em>. It is not yet a link you can paste into a PR.</p>
<p>On a <strong>shared review host</strong> with a real wildcard DNS record, it is — that is exactly what<br />
<code>*.review.cell.zfin.org</code> would buy, and it is the one thing still blocked on someone<br />
outside this room.</p>
<p><strong>So today:</strong> proposition 1 is delivered, and proposition 2 works for <em>your own</em> review of<br />
someone's branch. The shareable link needs the DNS record.</p>
<p><em>This is the main reason to prioritise that ask.</em></p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="17" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--class:lead;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>

<h1 id="where-this-is-more-complicated-than-it-needs-to-be">Where this is more complicated than it needs to be</h1>
<p>An honest list. Several of these are worth cutting.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="simplification-candidate-three-data-modes">Simplification candidate: three data modes</h2>
<p>A feature can have <strong>its own</strong> db+solr, <strong>share</strong> <code>zfin_shared</code>, or be <strong>frozen</strong>. Each<br />
is a different compose file list, a different volume set, a different teardown path.</p>
<p><code>--shared-db</code> may in fact be the <em>primary</em> disk strategy — §5.4 argues a sharer reclaims<br />
little from freezing precisely because sharing already avoided the cost.</p>
<p><strong>Question for the team:</strong> if most review stacks are read-mostly, should <code>--shared-db</code><br />
become the <strong>default</strong>, making own-data the exception? That would shrink freeze/thaw from<br />
load-bearing to occasional.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="simplification-candidate-profile-initialisation-done-properly">Simplification candidate: profile initialisation, done properly</h2>
<p>The sidecar inherits <code>compile</code>'s login profile, which assumes mounts the sidecar<br />
deliberately does not have. Three separate papercuts:</p>
<ul>
<li><code>/mnt/research</code> → six <code>mkdir: Permission denied</code> on every entry</li>
<li><code>~/.claude.json</code> → onboarding re-ran every time, asking for login</li>
<li>TLS cert → regenerated on every entry</li>
</ul>
<p>Each fixed separately. <strong>The pattern says the profile is doing too much</strong> — it runs<br />
<code>generate_base.sh</code> on <em>every login shell</em>, for every service, regardless of need.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="what-that-script-is-actually-doing">What that script is actually doing</h2>
<p><code>more_bash_profile</code> → <code>generate_base.sh</code>, on every login shell, in every service built on<br />
the compile image:</p>
<table>
<thead>
<tr>
<th>work</th>
<th>really is</th>
<th>belongs</th>
</tr>
</thead>
<tbody>
<tr>
<td>self-signed TLS cert + keystore</td>
<td><strong>stack setup</strong>, once</td>
<td>an init step, or image build</td>
</tr>
<tr>
<td>random <code>pg_pass</code></td>
<td><strong>stack setup</strong>, once — and it writes into the <em>source tree</em></td>
<td>provisioning, host-side</td>
</tr>
<tr>
<td><code>mkdir /mnt/research/vol/*</code></td>
<td><strong>image</strong> concern</td>
<td>the Dockerfile</td>
</tr>
<tr>
<td>generate <code>zfin.properties</code></td>
<td><strong>stack setup</strong>, once per instance</td>
<td>an explicit task</td>
</tr>
<tr>
<td>export env vars</td>
<td>genuinely per-shell</td>
<td>the profile</td>
</tr>
</tbody>
</table>
<p>Only the last row belongs in a login profile. The rest is one-time initialisation that<br />
happens to have been put where it would definitely run.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="how-to-do-it-properly">How to do it properly</h2>
<p><strong>Separate the two concerns.</strong> A login profile should set up <em>your shell</em>. Initialising a<br />
<em>stack</em> is a different job with a different lifetime.</p>
<p><strong>Make init explicit and once-per-stack.</strong> Compose already has the mechanism:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">services:</span>
  <span class="hljs-attr">init:</span>                       <span class="hljs-comment"># certs, keystore, properties — runs once, exits</span>
    <span class="hljs-attr">profiles:</span> []              <span class="hljs-comment"># part of every up</span>
  <span class="hljs-attr">tomcat:</span>
    <span class="hljs-attr">depends_on:</span>
      <span class="hljs-attr">init:</span> { <span class="hljs-attr">condition:</span> <span class="hljs-string">service_completed_successfully</span> }
</code></pre>
<p><strong>Let services opt in.</strong> The sidecar needs none of it — and proved the point by failing<br />
three different ways when it inherited all of it anyway.</p>
<p><strong>Move image concerns to the image.</strong> Directories that must merely <em>exist</em> are <code>RUN mkdir</code>,<br />
not runtime work repeated on every shell.</p>
<p><em>Payoff: entering any container gets quiet and fast, and &quot;which mounts does this service<br />
actually need?&quot; becomes answerable.</em></p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="smaller-rough-edges">Smaller rough edges</h2>
<ul>
<li><strong>Archive retention</strong> — nothing prunes <code>/opt/zfin/stack-archive</code>. <code>rm</code> clears its own; frozen stacks accumulate.</li>
<li><strong>Freeze concurrency</strong> — two at once, or one racing <code>z feature new</code>, want a lockfile.</li>
<li><strong><code>z shared</code> reboot survival</strong> — the proxy has <code>restart: unless-stopped</code>; the shared data stack doesn't.</li>
<li><strong><code>DISABLE_OIDC=true</code></strong> turns <code>/jobs</code>, <code>/solr</code>, <code>/logs</code>, <code>/mailpit</code> into <code>Require all granted</code>. Per-host and untracked, so nobody can see which boxes opted out.</li>
</ul>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="23" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--class:lead;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>

<h1 id="questions-youre-going-to-ask">Questions you're going to ask</h1>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="is-a-real-database-on-a-real-url-safe">&quot;Is a real database on a real URL safe?&quot;</h2>
<p>The honest answer: <strong>the allowlist is doing the work.</strong></p>
<p>The preloaded images carry a real loaded ZFIN database. Reference docs call them<br />
local-only, &quot;a structural choice, not an oversight&quot; — and this feature's whole purpose is<br />
to undo that.</p>
<p>Two controls, covering different things:</p>
<table>
<thead>
<tr>
<th></th>
<th>protects</th>
<th>leaves open</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>IP allowlist</strong> (proxy)</td>
<td>everything, incl. the database</td>
<td>nothing, inside the ranges</td>
</tr>
<tr>
<td><strong>OIDC</strong> (<code>DISABLE_OIDC=false</code>)</td>
<td><code>/jobs</code>, <code>/solr</code>, <code>/logs</code>, <code>/mailpit</code></td>
<td>the site itself</td>
</tr>
</tbody>
</table>
<p>Dropping the Jenkins vhost was <strong>minimalism, not security</strong> — <code>/jobs</code> is on the same vhost.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="what-about-the-agent-exfiltrating-data">&quot;What about the agent exfiltrating data?&quot;</h2>
<p><strong>Not currently mitigated, and worth being clear about.</strong></p>
<p>Everything built shrinks the <em>filesystem and credential</em> blast radius. None of it stops<br />
data leaving over the network. The sidecar can read every row of the database and make<br />
arbitrary outbound HTTP. No credential needed.</p>
<p>The realistic attack is <strong>prompt injection</strong> — ticket text, dependency READMEs, web docs —<br />
with <code>--dangerously-skip-permissions</code> meaning nobody approves each action.</p>
<p>An egress allowlist is planned. But it must permit the Anthropic API, npm, Maven and<br />
GitHub — each a channel data can be tunnelled through. It <strong>raises the bar; it does not<br />
close the door.</strong></p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="are-we-locked-into-nginx-proxy">&quot;Are we locked into nginx-proxy?&quot;</h2>
<p>No. The vendor contract is <strong>four env vars in one overlay file</strong>. Everything else goes<br />
through <code>DOCKER_VIRTUAL_HOST</code>, which is ours and vendor-neutral.</p>
<p>Swapping to Traefik or Caddy is a contained edit. And <code>stacks.json</code> — written for the<br />
landing page — means a templated plain-nginx config is available too, which would remove<br />
the Docker socket entirely.</p>
<p><em>Traefik has built-in DNS-01 wildcard ACME, which would solve the certificate problem<br />
outright. That's a reason we might switch on our own initiative.</em></p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="why-cant-i-reach-postgres-by-hostname">&quot;Why can't I reach Postgres by hostname?&quot;</h2>
<p>Because the wire protocol carries no hostname, and these stacks speak plain TCP — no TLS,<br />
so no SNI either.</p>
<p>It <em>could</em> be done: enable <code>ssl=on</code>, have clients use <code>sslmode=require</code>, and route on SNI<br />
with a stream proxy. But that means a certificate per stack, a second proxy mechanism, and<br />
a hostname→upstream map regenerated on every lifecycle event.</p>
<p><strong>We decided against it.</strong> <code>docker exec &lt;stack&gt;-db-1 psql</code> already works.</p>
<p>Solr needed no work at all — <code>httpd</code> already proxies <code>/solr</code>, so its published port was<br />
simply deleted. <strong>JDWP</strong> is the one that genuinely pins the loopback IP: a fixed handshake,<br />
zero routing information.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>
<h2 id="whats-it-going-to-cost-me-to-adopt">&quot;What's it going to cost me to adopt?&quot;</h2>
<p>Once per machine:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">./z scaffold --root ~/zfin-dev   <span class="hljs-comment"># the tree; then set ZFIN_DEV_ROOT in docker/.env</span>
brew install dnsmasq             <span class="hljs-comment"># wildcard DNS for the zone — now a prerequisite</span>
brew install mkcert &amp;&amp; mkcert -install
claude setup-token               <span class="hljs-comment"># only if you want the sidecar</span>
</code></pre>
<p>Then per feature, one command. Freeze when you need the disk back; thaw when you return.</p>
<p><strong>What you give up:</strong> <code>getdb</code>/<code>getsolr</code> don't work from a container (no credentials, by<br />
design) — fetch dumps on the host. And unrouted stacks have no hostname.</p>
<footer>branch: preloaded-dev-stacks</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Review stacks" data-footer="branch: preloaded-dev-stacks" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="29" style="--paginate:true;--header:Review stacks;--footer:branch: preloaded-dev-stacks;--class:lead;--theme:default;" data-marpit-pagination-total="29">
<header>Review stacks</header>

<h2 id="what-id-like-from-this-review">What I'd like from this review</h2>
<ol>
<li><strong>The DNS record for <code>*.review.cell.zfin.org</code>.</strong> This is what turns a review stack into<br />
a link you can paste into a PR — the headline benefit, and the only piece blocked on<br />
someone outside the team.</li>
<li><strong>Allowlist ranges</strong> — campus, VPN, both? And should the review host run with OIDC on,<br />
which would protect <code>/jobs</code>, <code>/solr</code>, <code>/logs</code> and <code>/mailpit</code> as well?</li>
<li><strong>Should <code>--shared-db</code> be the default?</strong> If most review stacks are read-mostly, sharing<br />
one data tier may be the primary disk strategy — which would demote freeze/thaw from<br />
load-bearing to occasional.</li>
<li><strong>Is a wildcard private key on laptops acceptable?</strong> If not, only the shared host gets<br />
real certificates and laptops keep a local CA.</li>
<li><strong>Appetite for the profile-initialisation rework?</strong> It is hygiene, not a blocker — but it<br />
is the largest remaining piece of cleanup, and it touches every service's startup.</li>
</ol>
<p>Everything else is working and in use. These five shape what it looks like in six months.</p>
<footer>branch: preloaded-dev-stacks</footer>
