services:
  base:
    build: ./base/
    image: ghcr.io/zfin/zfin-base:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    environment:
      TZ: ${TZ}
  compile:
    # NO depends_on here, deliberately. `docker compose run <svc>` starts a service's
    # dependencies by default, so a `depends_on: db` would silently turn `./z run compile` --
    # the most-used command in the toolchain -- from "starts nothing" into "boots a 19G
    # Postgres". That is actively wrong once a stack being down is a normal state:
    # `./z run compile -c "npm ci"` should not start a database. The build tier is sequenced
    # explicitly by the commands that need it, not by the graph.
    build:
      context: ./compile/
      args:
        ZFIN_RELEASE: ${ZFIN_RELEASE}
        DOCKER_ARCH: ${DOCKER_ARCH:-}
    image: ghcr.io/zfin/zfin-compile:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    profiles:
      - compile
    environment:
      PGHOST: db
      PGUSER: postgres
      # No SSH_AUTH_SOCK / agent socket / known_hosts anywhere in this service, on purpose:
      # nothing running in `compile` can push or SSH out with your keys
      # (workbench/claude-sidecar.md). SSH_USER/HOST are kept because they're plain strings (no
      # credential) that the remote-fetch tasks put in their error messages. Those tasks
      # (gradle getdb/getsolr) do not work from here -- copy dumps to the mounted unloads
      # paths from the host instead.
      SSH_USER: ${DOCKER_SSH_USER}
      SSH_HOST: ${DOCKER_SSH_HOST}
      TZ: ${TZ}
      ELK_VERSION: ${ELK_VERSION}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      INSTANCE: ${DOCKER_INSTANCE}
      ZFIN_RELEASE: ${ZFIN_RELEASE}
      # Dev-only opt-in: adds a *.zfin.test wildcard to the self-signed cert generate_base.sh
      # makes (see more_bash_profile). Unset -> false -> staging/prod keep a zfin.org-only cert.
      ZFIN_DEV_CERT_SAN: ${ZFIN_DEV_CERT_SAN:-false}
      DOCKER_SSH_USER: ${DOCKER_SSH_USER}
      DOCKER_SSH_HOST: ${DOCKER_SSH_HOST}
      DOCKER_DB_UNLOADS_PATH: ${DOCKER_DB_UNLOADS_PATH}
      DOCKER_SOLR_UNLOADS_PATH: ${DOCKER_SOLR_UNLOADS_PATH}
      DOCKER_BLASTSERVER_BLAST_DATABASE_PATH: ${DOCKER_BLASTSERVER_BLAST_DATABASE_PATH}
      DOCKER_ABBLAST_PATH: ${DOCKER_ABBLAST_PATH}
      DOCKER_RESEARCH_PATH: ${DOCKER_RESEARCH_PATH}
      DOCKER_DOWNLOADS_PATH: ${DOCKER_DOWNLOADS_PATH}
      DOCKER_LOADUP_PATH: ${DOCKER_LOADUP_PATH}
      DOCKER_HHATLAS_PATH: ${DOCKER_HHATLAS_PATH}
      DOCKER_SOURCE_ROOTS_PATH: ${DOCKER_SOURCE_ROOTS_PATH}
      DOCKER_VIRTUAL_HOST: ${DOCKER_VIRTUAL_HOST}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      DOCKER_INSTANCE: ${DOCKER_INSTANCE}
      OPENIDC_CLIENTID: ${OPENIDC_CLIENTID}
      OPENIDC_CLIENTSECRET: ${OPENIDC_CLIENTSECRET}
      OPENIDC_CRYPTOPASSPHRASE: ${OPENIDC_CRYPTOPASSPHRASE}
#      #UNCOMMENT BELOW FOR PERL DEBUGGING
#    ports:
#      - "127.0.0.1:12345-12354:12345"
    volumes:
      - www_data:/opt/zfin/www_homes/zfin.org
      - static_data:/opt/zfin/static
      - downloads_data:/opt/zfin/download-files
      - httpd_log:/opt/zfin/log/httpd
      - tls_certs:/opt/zfin/tls
      - keystore:/opt/apache/apache-tomcat/conf
      - certbot_data:/etc/letsencrypt
      - catalina_base:/opt/zfin/catalina_bases/zfin.org
      - jenkins_data:/opt/zfin/www_homes/zfin.org/server_apps/jenkins/jenkins-home
      - ${DOCKER_SOURCE_ROOTS_PATH}:/opt/zfin/source_roots/zfin.org:rw
      #- nfs-zunloads:/research/zunloads
      - ${DOCKER_DB_UNLOADS_PATH}:/opt/zfin/unloads/db
      - ${DOCKER_SOLR_UNLOADS_PATH}:/opt/zfin/unloads/solr
      - ${DOCKER_BLASTSERVER_BLAST_DATABASE_PATH}:/opt/zfin/blastdb
      - ${DOCKER_ABBLAST_PATH}:/opt/ab-blast
      - ${DOCKER_BOWTIE_PATH}/bowtie:/opt/misc/bowtie
      - ${DOCKER_BOWTIE_PATH}/bowtie2:/opt/misc/bowtie2
      - ${DOCKER_RESEARCH_PATH}:/mnt/research
      - ${DOCKER_LOADUP_PATH}:/opt/zfin/loadUp
      - ${DOCKER_DOWNLOADS_PATH}:/opt/zfin/download-files
      - ${DOCKER_GFF3_PATH}:/opt/zfin/gff3
      # NO /var/run/docker.sock here, on purpose. Mounting the host daemon socket into a build
      # container is root-equivalent on the host, which is the single biggest reason `compile`
      # could not be the home for an autonomous agent (workbench/claude-sidecar.md). Its only
      # consumer was buildfiles/tomcat.xml's docker-tomcat-start/stop, which were also broken for
      # feature stacks (no -p). Tomcat lifecycle is a host operation: `z restart tomcat`.
      - maven_cache:/home/gradle/.m2
      - gradle_cache:/home/gradle/.gradle
      - npm_cache:/home/gradle/.npm
  claude:
    # The per-feature Claude sidecar (docker/claude/Dockerfile, workbench/claude-sidecar.md).
    # Reached by the verb that already reaches services -- `./z run claude`, like `./z run
    # compile` -- so there is no bespoke command and no second way in. The profile keeps it out
    # of a plain `up`; `docker compose run <svc>` enables a service's own profile.
    profiles:
      - claude
    build:
      context: ./claude/
      args:
        ZFIN_RELEASE: ${ZFIN_RELEASE}
        DOCKER_ARCH: ${DOCKER_ARCH:-}
    # Local-only name (no ghcr.io prefix): a developer's agent environment is not registry
    # material.
    image: zfin-claude:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    pull_policy: never
    environment:
      PGHOST: db
      PGUSER: postgres
      TZ: ${TZ}
      INSTANCE: ${DOCKER_INSTANCE}
      ZFIN_RELEASE: ${ZFIN_RELEASE}
      DOCKER_INSTANCE: ${DOCKER_INSTANCE}
      DOCKER_VIRTUAL_HOST: ${DOCKER_VIRTUAL_HOST}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      # Claude Code keeps ~/.claude.json BESIDE ~/.claude, so by default it lands in the
      # throwaway layer and every entry looks like a first-ever install -- asking you to log in
      # again with a valid token already present. Point it at the mounted volume and onboarding
      # happens once.
      CLAUDE_CONFIG_DIR: /home/gradle/.claude
      # Serves no TLS, so it needs no cert -- and mounting tls_certs to persist one would hand
      # it the stack's private key for nothing.
      ZFIN_SKIP_CERT_SETUP: "true"
      # Lets a session identify itself rather than infer it: /.dockerenv proves "a container",
      # this proves "the ZFIN sidecar", where `z`/`zrun` are host commands and refuse.
      ZFIN_SIDECAR: "true"
    volumes:
      # The one feature worktree, read-write -- the point of the thing.
      - ${DOCKER_SOURCE_ROOTS_PATH}:/opt/zfin/source_roots/zfin.org:rw
      # Its own ~/.claude, per stack. `z feature freeze` archives this volume, which is why the
      # auth token is NOT kept in it -- that comes from a host file, read-only, one file, so the
      # container can use the token but not rewrite it.
      - claude_home:/home/gradle/.claude
      - ${ZFIN_CLAUDE_TOKEN_FILE:-/dev/null}:/run/secrets/claude-token:ro
      # Dumps read-only, so `loaddb`/`loadsolr` work. Withholding them would buy nothing -- the
      # sidecar already reaches the live database over the compose network and can read every
      # row. Contrast /mnt/research, deliberately NOT mounted: that one spans other instances
      # and production unloads. :ro also means the agent cannot corrupt the dumps every other
      # stack loads from. (`loaddb` does destroy and rebuild THIS stack's database -- accepted,
      # because a thaw or re-seed restores it in about two minutes.)
      - ${DOCKER_DB_UNLOADS_PATH}:/opt/zfin/unloads/db:ro
      - ${DOCKER_SOLR_UNLOADS_PATH}:/opt/zfin/unloads/solr:ro
      # Build/deploy targets, so the agent can compile, test and dirtydeploy rather than handing
      # every build back to a human.
      - www_data:/opt/zfin/www_homes/zfin.org
      - catalina_base:/opt/zfin/catalina_bases/zfin.org
      - keystore:/opt/apache/apache-tomcat/conf
      # generate_base.sh's cert steps are guarded by `if [ ! -f ]`; they re-ran on every entry
      # only because without this mount the cert landed in the throwaway layer. Mounting it
      # makes the guard work.
      - tls_certs:/opt/zfin/tls
      - static_data:/opt/zfin/static
      - maven_cache:/home/gradle/.m2
      - gradle_cache:/home/gradle/.gradle
      - npm_cache:/home/gradle/.npm
      # NO docker.sock and NO ssh-auth.sock, on purpose: those two mounts are what made
      # `--dangerously-skip-permissions` in `compile` more dangerous than running on the host.
      # Omitting them is what makes "the agent cannot push" structural rather than a rule
      # someone has to remember (workbench/claude-sidecar.md).

  db:
    build: ./postgresql/
    image: ghcr.io/zfin/zfin-db:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    # Memory settings sized down from a prior 16g shared_buffers / 8g work_mem
    # configuration that contributed to repeated container OOMs during heavy
    # DIH workloads on a 32g host. Dial back up if you have a clearly RAM-rich
    # host and a workload that benefits.
    # work_mem is 128MB, paired with the 2g shm_size below -- the two have to be chosen together.
    command: -c 'max_connections=7500' -c 'shared_buffers=4GB' -c 'huge_pages=try' -c 'temp_buffers=256MB' -c 'work_mem=128MB' -c 'maintenance_work_mem=1GB' -c 'max_wal_size=10GB' -c 'timezone=America/Los_Angeles' -c 'shared_preload_libraries="pg_stat_statements"'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pass
      POSTGRES_INITDB_ARGS: "-E SQL_ASCII"
      POSTGRES_DB: zfindb
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: ${TZ}
    shm_size: 2g
    # The readiness definition the app tier's `depends_on: condition: service_healthy` waits
    # on. Keep the probe in step with StackConfig.DB_PROBE, which is the same check in argv
    # form for containers started OUTSIDE compose (build-preloaded's throwaway postgres has no
    # compose healthcheck to read). YAML cannot import Groovy, so this pair is kept in sync by
    # hand -- both sides carry this note.
    #
    # start_period is generous on purpose: a preloaded db is serving in seconds, but a base
    # stack doing a cold initdb is not, and a healthcheck that gives up early turns a slow
    # boot into "dependency failed to start".
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "zfindb"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    ports:
      - "${DOCKER_DB_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/
      - ${DOCKER_SOURCE_ROOTS_PATH}/docker/pg_pass:/run/secrets/pg_pass:ro
      - www_data:/opt/zfin/www_homes/zfin.org
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  solr:
    build: ./solr/
    image: ghcr.io/zfin/zfin-solr:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    # Cap memory at heap + ~4g headroom (direct buffers, metaspace, jit code
    # cache, stack, native libs). Without this the kernel chooses which
    # container to OOM when the host gets tight, and Solr is always the
    # biggest target.
    # Sized for PROD by default. A feature stack sets DOCKER_SOLR_MEM_LIMIT=6g and
    # DOCKER_SOLR_HEAP=4g in its .env: one user and low query concurrency need nothing like
    # this, and several stacks share one Docker VM, where solr at 12g does not come up at all.
    mem_limit: ${DOCKER_SOLR_MEM_LIMIT:-16g}
    ulimits:
      nofile: 65536
    # Add fishadmin (gid 1076) so the non-root solr user can write backup snapshots to the group-owned unloads dir (which must also be g+w).
    group_add:
      - "1076"   # fishadmin
    environment:
      SOLR_MODULES: "scripting"
      SOLR_HEAP: ${DOCKER_SOLR_HEAP:-12g}
      # solr.max.booleanClauses: Solr 9.x reads this at JVM startup and uses
      # it as the ceiling for IndexSearcher.MAX_CLAUSE_COUNT. The per-core
      # <maxBooleanClauses> in solrconfig.xml can't exceed this JVM-level
      # value, so bumping it there alone doesn't help. Edismax query
      # expansion can produce more clauses on Solr 9 than Solr 8 did for
      # the same user input — 4096 covers the long queries from our prod
      # access log that overflowed 1024 during cutover characterization.
      SOLR_OPTS: "-Dsolr.allowPaths=/opt/zfin/unloads/solr -Dsolr.max.booleanClauses=4096"
      SOLR_SECURITY_MANAGER_ENABLED: "false"
      TZ: ${TZ}
    ports:
      # Loopback by default: Solr's admin UI and its update handlers are unauthenticated, so
      # an unset variable must not put them on every interface. Feature stacks set
      # DOCKER_SOLR_PORT=<loopback-ip>:8983 for the same-port/differ-by-IP scheme.
      - "${DOCKER_SOLR_PORT:-127.0.0.1:8983-9002}:8983"
    volumes:
      # Single volume covering everything Solr persists. The image's
      # /docker-entrypoint-initdb.d/sync-config.sh refreshes conf/, lib/, and
      # log4j2.xml from image-baked templates on every container start, so
      # this volume only legitimately holds index data, tlog, snapshots,
      # external_popularity.txt, and runtime logs. Renamed from `solr_data`
      # so VMs upgrading from Solr 8 get a clean volume instead of
      # inheriting stale 8-era config + jars.
      - solr_var:/var/solr
      - ${DOCKER_SOLR_UNLOADS_PATH}:/opt/zfin/unloads/solr
  httpd:
    hostname: zfin.org
    # Ordering, and why every edge is `required: false`: docker-compose.shared-db.yml
    # suppresses db/solr with a never-enabled profile, and a HARD dependency on a service no
    # active profile enables is a startup error. `required: false` skips an absent dependency
    # and still applies the condition when it is present -- so shared-db stacks need no
    # override at all.
    #
    # These edges exist as much for SHUTDOWN as for startup: compose stops in reverse
    # dependency order, which is what keeps Tomcat from writing to Postgres while it is being
    # snapshotted. Stop order follows the graph, not the condition, so the cheapest defensible
    # condition still buys correct ordering. httpd waits only for tomcat to START: a 502 during
    # warm-up is self-correcting and needs no tomcat healthcheck.
    depends_on:
      tomcat:
        condition: service_started
        required: false
    build: ./httpd/
    image: ghcr.io/zfin/zfin-httpd:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    environment:
      # WHICH PROXY SERVES THIS STACK. DOCKER_VIRTUAL_HOST stays what it has always been --
      # the hostname the stack is served at, vendor-neutral, used by the app for its own URLs.
      # Two optional variables say who should route that hostname, and a stack's .env sets them:
      #
      #   unset (an instance, or a plain dev stack)
      #       An external nginx-proxy sees the stack and acme issues its certificate.
      #   DOCKER_EXTERNAL_VHOST= (empty) + DOCKER_REVIEW_VHOST=<host>   (`z feature new` writes
      #       these for a routed feature) The review proxy serves it instead: the stack is
      #       invisible to any external proxy, and asks acme for nothing.
      #
      # `-` and not `:-`, deliberately: only an UNSET variable falls back, so an .env that
      # names one as empty gets empty, and an .env that has never heard of them is unchanged.
      # Both nginx-proxy and acme-companion skip an empty value explicitly (their templates
      # `continue` on it), so empty here means exactly what deleting the key would.
      #
      # One variable covers VIRTUAL_HOST and LETSENCRYPT_HOST because they answer the same
      # question: a proxy that serves the hostname is the one that should hold its certificate.
      LETSENCRYPT_HOST: ${DOCKER_EXTERNAL_VHOST-${DOCKER_VIRTUAL_HOST}}
      VIRTUAL_HOST: ${DOCKER_EXTERNAL_VHOST-${DOCKER_VIRTUAL_HOST}}
      ZFIN_VIRTUAL_HOST: ${DOCKER_REVIEW_VHOST-}
      VIRTUAL_PROTO: https
      VIRTUAL_PORT: 443
      OPENIDC_CRYPTOPASSPHRASE: ${OPENIDC_CRYPTOPASSPHRASE}
      OPENIDC_CLIENTID: ${OPENIDC_CLIENTID}
      OPENIDC_CLIENTSECRET: ${OPENIDC_CLIENTSECRET}
      DISABLE_OIDC: ${DISABLE_OIDC:-false}
      TZ: ${TZ}
    ports:
      # Loopback by default, like every other published port here. Production does NOT arrive
      # this way -- nginx-proxy reaches httpd by container IP over a shared Docker network
      # (VIRTUAL_HOST above), so the published port serves only local browsing. An unset
      # variable therefore means "a developer did not think about it", and the safe reading of
      # that is 127.0.0.1. Reaching a stack from another machine is an explicit
      # DOCKER_HTTPD_HTTP_PORT=0.0.0.0:8080 in that host's .env.
      #
      # Twenty slots each. Docker fails a container when its range is full, and every stack on
      # the host draws from these -- routed or not -- so the range is the ceiling on concurrent
      # stacks. Disk gives out long before it does (tens of GB per stack against ~20 slots),
      # which is the point: the limit should never be the one that bites.
      - "${DOCKER_HTTPD_HTTP_PORT:-127.0.0.1:8080-8099}:80"
      - "${DOCKER_HTTPD_HTTPS_PORT:-127.0.0.1:8443-8462}:443"
    volumes:
      - www_data:/opt/zfin/www_homes/zfin.org
      - static_data:/opt/zfin/static
      - httpd_log:/var/log/httpd
      - tls_certs:/opt/zfin/tls
      #- nfs-loadup:/opt/zfin/loadUp
      - ${DOCKER_LOADUP_PATH}:/opt/zfin/loadUp
      - ${DOCKER_DOWNLOADS_PATH}:/opt/zfin/download-files
      - ${DOCKER_HHATLAS_PATH}:/opt/zfin/hh_atlas
      #- /etc/pki/tls/certs/incommon_intermediate_bundle.crt:/etc/pki/tls/certs/incommon_intermediate_bundle.crt,ro
      #- /etc/pki/tls/certs/zfin_2021.crt:/etc/pki/tls/certs/zfin_2021.crt,ro
      #- /etc/pki/tls/private/zfin_2021.key:/etc/pki/tls/private/zfin_2021.key,ro
      - certbot_data:/etc/letsencrypt
  certbot:
    build: ./certbot/
    volumes:
      - certbot_data:/etc/letsencrypt
      - www_data:/opt/zfin/www_homes/zfin.org
  tomcat:
    # db gets service_healthy because Hibernate init genuinely cannot proceed without it --
    # this is the edge that stops the flaky cold start where Tomcat boots first and throws
    # connection errors. solr only needs service_started: the app degrades rather than fails
    # without it, and waiting on a Solr healthcheck would add minutes to every `up`.
    depends_on:
      db:
        condition: service_healthy
        required: false
      solr:
        condition: service_started
        required: false
    build: ./tomcat/
    image: ghcr.io/zfin/zfin-tomcat:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    environment:
      CATALINA_BASE: /opt/zfin/catalina_bases/zfin.org
      INSTANCE: docker
      JVM_OPTS: -Xms2048m -Xmx8192m -Xss2m
      UMASK: "002"
      TZ: ${TZ}
    volumes:
      - www_data:/opt/zfin/www_homes/zfin.org
      - catalina_base:/opt/zfin/catalina_bases/zfin.org
      - keystore:/opt/apache/apache-tomcat/conf
      - ${DOCKER_BLASTSERVER_BLAST_DATABASE_PATH}:/opt/zfin/blastdb
      - ${DOCKER_ABBLAST_PATH}:/opt/ab-blast
      - ${DOCKER_BOWTIE_PATH}/bowtie:/opt/misc/bowtie
      - ${DOCKER_BOWTIE_PATH}/bowtie2:/opt/misc/bowtie2
      - ${DOCKER_DOWNLOADS_PATH}:/opt/zfin/download-files
      - ${DOCKER_LOADUP_PATH}:/opt/zfin/loadUp
      - ${DOCKER_GFF3_PATH}:/opt/zfin/gff3
  tomcatdebug:
    hostname: tomcat
    depends_on:                      # same contract as tomcat
      db:
        condition: service_healthy
        required: false
      solr:
        condition: service_started
        required: false
    build: ./tomcat/
    profiles:
      - debug
    environment:
      CATALINA_BASE: /opt/zfin/catalina_bases/zfin.org
      INSTANCE: docker
      JVM_OPTS: -Xms2048m -Xmx8192m -Xss2m
      UMASK: "002"
      TZ: ${TZ}
      JPDA_ADDRESS: "*:5000"
      JPDA_TRANSPORT: dt_socket
    entrypoint: ["catalina.sh", "jpda", "run"]
    ports:
      # Feature stacks set DOCKER_TOMCATDEBUG_PORT=<loopback-ip>:5000 so two
      # stacks can expose the JPDA debug port at once without colliding.
      - "${DOCKER_TOMCATDEBUG_PORT:-127.0.0.1:5000}:5000"
    volumes:
      - www_data:/opt/zfin/www_homes/zfin.org
      - catalina_base:/opt/zfin/catalina_bases/zfin.org
      - keystore:/opt/apache/apache-tomcat/conf
      - ${DOCKER_BLASTSERVER_BLAST_DATABASE_PATH}:/opt/zfin/blastdb
      - ${DOCKER_ABBLAST_PATH}:/opt/ab-blast
      - ${DOCKER_BOWTIE_PATH}/bowtie:/opt/misc/bowtie
      - ${DOCKER_BOWTIE_PATH}/bowtie2:/opt/misc/bowtie2
      - ${DOCKER_DOWNLOADS_PATH}:/opt/zfin/download-files
      - ${DOCKER_LOADUP_PATH}:/opt/zfin/loadUp
      - ${DOCKER_GFF3_PATH}:/opt/zfin/gff3
  blast:
    build: ./blast/
    platform: linux/amd64
    environment:
      TZ: ${TZ}
    volumes:
      - ${DOCKER_ABBLAST_PATH}:/opt/ab-blast
      - ${DOCKER_BOWTIE_PATH}/bowtie:/opt/misc/bowtie
      - ${DOCKER_BOWTIE_PATH}/bowtie2:/opt/misc/bowtie2
      - ${DOCKER_BLASTSERVER_BLAST_DATABASE_PATH}:/opt/zfin/blastdb
  mailpit:
    image: axllent/mailpit
    # No container_name here: a fixed one makes mailpit a global singleton, so only one
    # project can run it and parallel feature stacks collide on the name "/mailpit".
    # Unset, compose names it <project>-mailpit-1 like every other service.
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:25"
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_WEBROOT: /mailpit
    volumes:
      - mailpit_data:/data
  jenkins:
    # Jenkins jobs hit the database directly (PGHOST: db below), so it belongs in the graph --
    # and, more to the point for freeze, it must stop BEFORE the db it writes to.
    depends_on:
      db:
        condition: service_healthy
        required: false
    build: 
      context: ./jenkins/
      args:
        ZFIN_RELEASE: ${ZFIN_RELEASE}
        DOCKER_ARCH: ${DOCKER_ARCH:-}
    image: ghcr.io/zfin/zfin-jenkins:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    ports:
      # Loopback-scoped default (like db/tomcatdebug) so an unpinned jenkins never grabs
      # 0.0.0.0:9499 and blocks every other stack's <loopback-ip>:9499. Feature stacks set
      # DOCKER_JENKINS_HTTP_PORT=<loopback-ip>:9499.
      - "${DOCKER_JENKINS_HTTP_PORT:-127.0.0.1:9499-9509}:9499"
    environment:
      PGHOST: db
      PGUSER: postgres
      TZ: ${TZ}
      INSTANCE: ${DOCKER_INSTANCE}
      OPENIDC_CLIENTID: ${OPENIDC_CLIENTID}
      OPENIDC_CLIENTSECRET: ${OPENIDC_CLIENTSECRET}
    volumes:
      #- jenkins_data:/var/jenkins_home
      - ${DOCKER_SOURCE_ROOTS_PATH}:/opt/zfin/source_roots/zfin.org
      - www_data:/opt/zfin/www_homes/zfin.org
      - catalina_base:/opt/zfin/catalina_bases/zfin.org
      - downloads_data:/opt/zfin/download-files
      - jenkins_data:/opt/zfin/www_homes/zfin.org/server_apps/jenkins/jenkins-home
      - ${DOCKER_RESEARCH_PATH}:/mnt/research
      - ${DOCKER_ABBLAST_PATH}:/opt/ab-blast
      - ${DOCKER_BOWTIE_PATH}/bowtie:/opt/misc/bowtie
      - ${DOCKER_BOWTIE_PATH}/bowtie2:/opt/misc/bowtie2
      - ${DOCKER_BLASTSERVER_BLAST_DATABASE_PATH}:/opt/zfin/blastdb
      - ${DOCKER_DB_UNLOADS_PATH}:/opt/zfin/unloads/db
      - ${DOCKER_SOLR_UNLOADS_PATH}:/opt/zfin/unloads/solr
      - ${DOCKER_DOWNLOADS_PATH}:/opt/zfin/download-files
      - ${DOCKER_LOADUP_PATH}:/opt/zfin/loadUp
      - ${DOCKER_GFF3_PATH}:/opt/zfin/gff3
      - maven_cache:/home/gradle/.m2
      - gradle_cache:/home/gradle/.gradle
      - npm_cache:/home/gradle/.npm
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  ncbiload:
    build: ./ncbiload/
    environment:
      PGHOST: localhost
      PGUSER: postgres
      TZ: ${TZ}
      INSTANCE: ${DOCKER_INSTANCE}
      IS_NCBI_LOAD_CONTAINER: "true"
    volumes:
      - ${DOCKER_SOURCE_ROOTS_PATH}:/opt/zfin/source_roots/zfin.org
      - ${DOCKER_RESEARCH_PATH}:/mnt/research
      - maven_cache:/home/gradle/.m2
      - gradle_cache:/home/gradle/.gradle
      - npm_cache:/home/gradle/.npm
  fail2ban:
    build: ./fail2ban/
    image: ghcr.io/zfin/zfin-fail2ban:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      VERBOSITY: -vv #optional
    volumes:
      - fail2ban_config:/config
      - httpd_log:/var/log/httpd:ro #optional
      - /etc/localtime:/etc/localtime:ro
  elasticsearch:
    build:
      context: ./elasticsearch/
      args:
        ELK_VERSION: ${ELK_VERSION}
    image: ghcr.io/zfin/zfin-elasticsearch:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    profiles:
      - logging
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:9200-9209:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  filebeat:
    build:
      context: ./filebeat/
      args:
        ELK_VERSION: ${ELK_VERSION}
    image: ghcr.io/zfin/zfin-filebeat:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    profiles:
      - logging
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      TZ: ${TZ}
    volumes:
      - httpd_log:/var/log/httpd
      - catalina_base:/opt/zfin/catalina_bases/zfin.org
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro      
  metricbeat:
    image: ghcr.io/zfin/zfin-metricbeat:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    build:
      context: ./metricbeat/
      args:
        ELK_VERSION: ${ELK_VERSION}
    profiles:
      - logging
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro      
    depends_on:
      - elasticsearch
  kibana:
    build:
      context: ./kibana/
      args:
        ELK_VERSION: ${ELK_VERSION}
    image: ghcr.io/zfin/zfin-kibana:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    profiles:
      - logging
    environment:
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:5601-5610:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data
  jbrowse:
    profiles:
      - jbrowse
    build:
      context: ./jbrowse/
      dockerfile: ./Dockerfile
    ports:
      - "127.0.0.1:8898-8907:80"
    volumes:
      - jbrowse_data:/data
  processgff:
    profiles:
      - jbrowse
    build:
      context: ./jbrowse/
      dockerfile: ./Dockerfile.processgff
    volumes:
      - jbrowse_data:/data

volumes:
  claude_home:
  gradle_cache:
  maven_cache:
  npm_cache:
  www_data:
  static_data:
  httpd_log:
  tls_certs:
  keystore:
  catalina_base:
  pg_data:
  solr_var:
  downloads_data:
  jenkins_data:
  fail2ban_config:
  elasticsearch_data:
  kibana_data:
  certbot_data:
  jbrowse_data:
  mailpit_data:
  nfs-zunloads:
    driver_opts:
      type: nfs
      o: addr=10.128.116.85,ro
      device: :/vol/unloads/
  nfs-loadup:
    driver_opts:
      type: nfs
      o: addr=10.128.116.85,ro
      device: :/vol/central/loadUp
