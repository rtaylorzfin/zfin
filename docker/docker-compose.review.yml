# Review proxy (project `zfin_review`) -- ONE per host. Routes https://<slug>.<zone> to the
# right feature stack's httpd, so many stacks share :443. Driven by `z review up|down|status`.
#
# HOW IT FINDS THE STACKS. Nothing enumerates them. nginx-proxy reads the Docker socket to see
# which containers are running and what environment each was started with; one variable on a
# container names the hostname it serves, and the config is rebuilt whenever containers come or
# go. Stock, that variable is VIRTUAL_HOST. Ours reads ZFIN_VIRTUAL_HOST instead, which
# docker-compose.overlay-review-member.yml sets on a routed stack's httpd -- because on the shared VMs
# IT's `ngproxy` watches this SAME socket, and a stock VIRTUAL_HOST would have it claim a
# hostname it has no route to and answer 502 for a stack we serve perfectly well.
#
# The rename is baked into the image; review-proxy/Dockerfile has the what and the why.
#
# WHAT `z review up` WRITES (ReviewStack.groovy), into $ZFIN_REVIEW_DIR and mounted below:
#   vhost.d/default  the IP allowlist. nginx-proxy includes this file into every server block.
#   certs/           the *.<zone> cert, plus a default.* copy the fallback server presents.
#
# <zone> is the DNS suffix every review stack lives under ($ZFIN_REVIEW_ZONE, e.g.
# coral.zfin.org); a stack is <slug>.<zone>. nginx-proxy resolves a vhost's cert by name and
# falls back to the wildcard formed by dropping the leftmost label, so ONE cert pair covers
# every stack that will ever exist and there is no per-stack cert machinery anywhere.
#
# A hostname in the zone that no stack claims falls back to the static 50x.html. That hook is
# fallback-only in the template, so a routed stack's genuine 502 still shows its own error.
#
# The docker.sock mount is the one exception to the no-socket rule in claude-sidecar.md:
# read-only, on a container that runs no ZFIN code and that the sidecar cannot reach.
#
# Details: ReviewStack.groovy, reference/dev-stacks.md, workbench/review-stacks.md 3.3/3.5.
networks:
  zfin_review_net:
    name: zfin_review_net          # fixed name: feature stacks join it as `external`

services:
  proxy:
    # Stock nginx-proxy with one token renamed; see review-proxy/Dockerfile for what and why.
    # The tag mirrors upstream's, so the pin is legible from here. `z review up` always passes
    # --build: two cached layers, and the image can never be stale relative to the Dockerfile.
    build: ./review-proxy/
    image: zfin-review-proxy:1.7-alpine
    container_name: zfin-review-proxy
    restart: unless-stopped
    ports:
      # addr:port per protocol. 0.0.0.0 on a review VM, 127.0.0.1 on a laptop; the ports stay
      # standard either way, so URLs never carry a :port suffix.
      - "${ZFIN_REVIEW_HTTP_BIND:-0.0.0.0:80}:80"
      - "${ZFIN_REVIEW_HTTPS_BIND:-0.0.0.0:443}:443"
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      TRUST_DOWNSTREAM_PROXY: ${ZFIN_REVIEW_TRUST_DOWNSTREAM:-false}
    volumes:
      # Only per-HOST state is mounted. Both are generated by `z review up` and change without
      # an image rebuild; everything static (the template, the fallback page) is baked in.
      - ${ZFIN_REVIEW_DIR}/certs:/etc/nginx/certs:ro
      - ${ZFIN_REVIEW_DIR}/vhost.d:/etc/nginx/vhost.d:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - zfin_review_net

